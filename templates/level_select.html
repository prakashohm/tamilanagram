<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tamil Anagram Game - Level Select</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --basic-badge: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --advanced-badge: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-family: 'Noto Sans Tamil', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: 'Noto Sans Tamil', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
            text-align: center;
            line-height: 1.4;
            text-shadow: 2px 2px 4px var(--shadow-color);
            animation: fadeInDown 0.8s ease-out;
        }

        .description {
            color: var(--text-secondary);
            margin-bottom: 3rem;
            font-size: 1.2rem;
            padding: 0 1rem;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 1rem;
            animation: fadeIn 1s ease-out 0.4s backwards;
        }

        .level-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .level-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                                      rgba(255, 255, 255, 0.1) 0%,
                                      rgba(255, 255, 255, 0) 50%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .level-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 45px var(--shadow-color);
        }

        .level-card:hover::before {
            opacity: 1;
        }

        .level-title {
            font-size: 1.8rem;
            margin-bottom: 1.2rem;
            font-weight: 700;
        }

        .level-description {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--basic-badge);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
        }

        .difficulty-badge.basic {
            background: var(--basic-badge);
        }

        .difficulty-badge.advanced {
            background: var(--advanced-badge);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .description {
                font-size: 1.1rem;
            }

            .level-card {
                padding: 2rem;
            }

            .level-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>தமிழ் சொல் விளையாட்டு</h1>
        <p class="description">எழுத்துக்களை மாற்றி அமைத்து சொல்லைக் கண்டுபிடிக்கவும்</p>
        
        <div class="level-grid">
            <a href="/play/basic" class="level-card">
                <h2 class="level-title">அடிப்படை நிலை</h2>
                <p class="level-description">4 அல்லது அதற்கும் குறைவான எழுத்துக்கள் கொண்ட சொற்கள்</p>
                <span class="difficulty-badge basic">எளிய</span>
            </a>
            
            <a href="/play/advanced" class="level-card">
                <h2 class="level-title">மேம்பட்ட நிலை</h2>
                <p class="level-description">4 எழுத்துக்களுக்கு மேல் உள்ள சொற்கள்</p>
                <span class="difficulty-badge advanced">கடினம்</span>
            </a>
        </div>
    </div>

    <script>
        document.querySelectorAll('.level-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / card.clientWidth) * 100;
                const y = ((e.clientY - rect.top) / card.clientHeight) * 100;
                card.style.setProperty('--mouse-x', `${x}%`);
                card.style.setProperty('--mouse-y', `${y}%`);
            });
        });
    </script>
</body>
</html>
